        family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1

    <!-- HOJA DE ESTILOS CSS -->

    <body>
    <article class="container">
        <form action="#" method="post" class="form">

        <section class="row">
            <section class="col-xs-12 col-sm-6 col-md-6">
            <img src="img/contacto.jpg" alt="" class="img-fluid" />
            </section>

            <section class="col-xs-12 col-sm-6 col-md-6">
            <label>Nombre:</label>
            <input type="text" class="input" placeholder="Ingrese su nombre" required>

            <label>Correo:</label>
            <input type="email" class="input" placeholder="Ingrese su correo" required>

            <label>Celular:</label>
            <input type="tel" class="input" placeholder="Ingrese su número" required>

            <label>Mensaje:</label>
            <textarea class="caja" placeholder="Ingrese su mensaje" required></textarea>

            <input type="submit" class="botonContacto" value="Enviar">

            </section>
        </section>
        <select class="lista">
        <option value="opcion1">Seleccione un Diplomado</option>
        <option value="opcion1">Programación Web</option>
        <option value="opcion1">Análisis de Datos</option>
        <option value="opcion1">Backend</option>
        </select>
        </form>
    </article>
    </body>
